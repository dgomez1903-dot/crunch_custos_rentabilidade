 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c)));
 try{sessionStorage.setItem('crunch_pw',pw)}catch(e){}
 document.open();document.write(html);document.close();}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='A abrir…';
 try{await open_(document.getElementById('pw').value)}catch(x){err.textContent='Palavra-passe errada.'}});
let s=null;try{s=sessionStorage.getItem('crunch_pw')}catch(e){}if(s)open_(s).catch(()=>{});
</script></body></html>
